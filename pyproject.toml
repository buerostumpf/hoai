[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hoai-python"
version = "0.2.0"
description = "HOAI 2013 fee calculation library and CLI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Johannes Stumpf"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hoai-fee = "calculate_fee:main"

